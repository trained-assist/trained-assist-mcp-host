name: Remote test Worker E2E

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remote-e2e.yml
      - scripts/remote-e2e.mjs
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Registry MCP test Worker]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mcp-host-test-worker-e2e
  cancel-in-progress: false

jobs:
  remote-e2e:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate host source and local contract tests
        run: npm run check && npm test
      - name: Run read-only remote discovery and synthetic signed fixture invocation
        env:
          MCP_TEST_AUTH_TOKEN: ${{ secrets.MCP_TEST_AUTH_TOKEN }}
          MCP_TEST_E2E_PRIVATE_JWK: ${{ secrets.MCP_TEST_E2E_PRIVATE_JWK }}
        run: node scripts/remote-e2e.mjs
