name: Remote test Worker E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authenticated discovery and signed fixture invocation
        env:
          MCP_TEST_AUTH_TOKEN: ${{ secrets.MCP_TEST_AUTH_TOKEN }}
          MCP_TEST_E2E_PRIVATE_JWK: ${{ secrets.MCP_TEST_E2E_PRIVATE_JWK }}
        run: npm run remote:e2e
