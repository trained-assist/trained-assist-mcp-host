name: Toggle Identity User Status

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "User ID to toggle (e.g. u-i05c-20261012-a-sales)"
        required: true
      status:
        description: "New status: active or disabled"
        required: true
        type: choice
        options:
          - active
          - disabled

permissions:
  contents: read

jobs:
  toggle:
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve D1 database_id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          db_id=$(npx --yes wrangler@4.146.0 d1 list --json --config wrangler.identity.jsonc 2>/dev/null \
            | node -e "const s=require('fs').readFileSync(0,'utf8');try{const l=JSON.parse(s);const a=Array.isArray(l)?l:[l];const d=a.find(x=>x.name==='trained-assist-mcp-identity');process.stdout.write(d?d.uuid:'')}catch{}")
          echo "Resolved database_id=$db_id"
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('wrangler.identity.jsonc','utf8'));cfg.d1_databases[0].database_id=process.argv[1];fs.writeFileSync('wrangler.identity.jsonc',JSON.stringify(cfg,null,2))" "$db_id"
      - name: Set user status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          USER_ID: ${{ inputs.user_id }}
          NEW_STATUS: ${{ inputs.status }}
        run: |
          npx --yes wrangler@4.146.0 d1 execute trained-assist-mcp-identity --remote --config wrangler.identity.jsonc \
            --command "UPDATE identity_users SET status='$NEW_STATUS', updated_at=$(date +%s)000 WHERE user_id='$USER_ID'"
          echo "=== Verify ==="
          npx --yes wrangler@4.146.0 d1 execute trained-assist-mcp-identity --remote --config wrangler.identity.jsonc \
            --command "SELECT user_id, role, status, updated_at FROM identity_users WHERE user_id='$USER_ID'"
